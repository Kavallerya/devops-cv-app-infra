---
# 1. СТВОРЮЄМО SERVICE (Внутрішній балансувальник)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80         # Порт сервісу
      targetPort: 80   # Порт Nginx всередині контейнера

---
# 2. СТВОРЮЄМО DEPLOYMENT (Сам додаток)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          # ВАЖЛИВО: Замініть на свій логін у DockerHub!
          image: kavallerya/cv-frontend:c01de9a8
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

          # Оскільки фронтенд (Nginx) дуже легкий, проби для нього простіші
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3